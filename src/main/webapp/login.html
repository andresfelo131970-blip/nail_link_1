<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nail Link - Iniciar Sesión</title>

    <style>
        :root {
            --bg-soft-pink: #fdf2f7; 
            --card-white: #ffffff;
            --primary-pink: #f4a2bd;
            --text-gray: #5a5a5a;
            --input-border: #f0e0e9;
            --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
            background-color: var(--bg-soft-pink);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background: var(--card-white);
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border-radius: 40px; 
            box-shadow: 0 15px 35px rgba(244, 162, 189, 0.2);
            text-align: center;
        }

        .logo-area img {
            width: 100px;
            margin-bottom: 10px;
        }

        .brand-name {
            font-size: 24px;
            font-weight: bold;
            color: #4a4a4a;
            margin-bottom: 5px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .slogan {
            font-size: 13px;
            color: var(--text-gray);
            margin-bottom: 35px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            margin-left: 5px;
            color: var(--text-gray);
            font-size: 14px;
        }

        .form-control {
            width: 100%;
            padding: 15px;
            border: 1.5px solid var(--input-border);
            border-radius: 15px;
            font-size: 15px;
            box-sizing: border-box; 
            outline: none;
            transition: all 0.3s ease;
            background-color: #fffbff;
        }

        .form-control:focus {
            border-color: var(--primary-pink);
            background-color: #fff;
            box-shadow: 0 0 8px rgba(244, 162, 189, 0.2);
        }


        .btn-submit {
            width: 100%;
            padding: 16px;
            background-color: var(--primary-pink);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s, 
        }

        .btn-submit:hover {
            background-color: #f08da5;
            transform: translateY(-2px);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .forgot-password {
            display: block;
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-gray);
            text-decoration: none;
        }

        .forgot-password:hover {
            color: var(--primary-pink);
        }

        @media (min-width: 768px) {
            body {
                background: linear-gradient(135deg, #fdf2f7 0%, #fae1ed 100%);
            }
        }
        .btn-volver {
           display: inline-block;
           margin: 20px;
           padding: 10px 20px;
           background-color: #f4a2bd;
           color: white;
           text-decoration: none;
           border-radius: 10px;
           font-weight: bold;
           transition: 0.3s;
        }

        .btn-volver:hover {
           background-color: #e68aa7;
        }
        .btn-volver {
           position: absolute;
           top: 20px;
           left: 20px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-area">
            <img src="img/logo4.png" alt="Nail Link Logo">
            <div class="brand-name">Nail Link</div>
            <div class="slogan">Tu SPA de uñas a un enlace de distancia</div>
        </div>

<form action="RegistroServlet" method="POST">

    <div class="form-group">
        <label for="usuario">Nombre de usuario</label>

        <input 
            type="text"
            id="usuario"
            name="usuario"
            class="form-control"
            placeholder="Ej: AndresRiaño"
            required>
    </div>

    <div class="form-group">
        <label for="password">Contraseña</label>

        <input 
            type="password"
            id="password"
            name="password"
            class="form-control"
            placeholder="••••••••"
            required>
    </div>

    <button type="submit" class="btn-submit">
        Ingresar
    </button>

</form>
        <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
    </div>
    <a href="index.html" class="btn-volver">← Volver al inicio</a>

</body>
</html>
